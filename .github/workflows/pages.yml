name: Actualizar sitio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar solo los archivos públicos
        run: |
          mkdir -p sitio-publicado
          cp index.html styles.css app.js precios.js anexo.html anexo.css anexo.js .nojekyll sitio-publicado/
          cp -r assets respaldo sitio-publicado/

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./sitio-publicado
          publish_branch: gh-pages
          force_orphan: true
          user_name: "SBG-UDG"
          user_email: "sebastian.banoz5068@alumnos.udg.mx"
          commit_message: "Publicar sitio"
